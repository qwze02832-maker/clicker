<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; user-select: none; }
        #score { font-size: 70px; color: #00ff88; margin-bottom: 20px; }
        #btn { width: 180px; height: 180px; border-radius: 50%; background: #333; border: 4px solid #00ff88; color: white; font-size: 24px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,255,136,0.3); }
        #btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="score">0</div>
    <div id="btn" onclick="addClick()">КЛИК!</div>

    <script>
        let clicks = 0;

        // 1. ФУНКЦИЯ СОХРАНЕНИЯ (И localStorage, и Cookie)
        function saveProgress(val) {
            // Сохраняем в localStorage
            localStorage.setItem('click_data', val);
            
            // Сохраняем в Cookie (на 365 дней)
            const date = new Date();
            date.setTime(date.getTime() + (365*24*60*60*1000));
            document.cookie = "click_data=" + val + "; expires=" + date.toUTCString() + "; path=/";
        }

        // 2. ФУНКЦИЯ ЗАГРУЗКИ
        function loadProgress() {
            // Пробуем взять из localStorage
            let saved = localStorage.getItem('click_data');

            // Если там пусто, ищем в Cookie
            if (!saved) {
                const name = "click_data=";
                const decodedCookie = decodeURIComponent(document.cookie);
                const ca = decodedCookie.split(';');
                for(let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) == ' ') c = c.substring(1);
                    if (c.indexOf(name) == 0) saved = c.substring(name.length, c.length);
                }
            }

            if (saved) {
                clicks = parseInt(saved);
                document.getElementById('score').innerText = clicks;
            }
        }

        function addClick() {
            clicks++;
            document.getElementById('score').innerText = clicks;
            saveProgress(clicks);
        }

        // Запускаем загрузку при старте
        window.onload = loadProgress;
    </script>
</body>
</html>
